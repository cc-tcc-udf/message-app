<section class="w-full h-full msg_list">
  <p-tabView (activeIndexChange)="onTabChange($event)">
    <p-tabPanel header="Todas">
      <app-message-list *ngIf="selectedIndex === 0" flag="all" />
    </p-tabPanel>
    <p-tabPanel header="Enviadas">
      <app-message-list *ngIf="selectedIndex === 1" flag="ENVIADO" />
    </p-tabPanel>
    <p-tabPanel header="Não enviadas">
      <app-message-list *ngIf="selectedIndex === 2" flag="NAO_ENVIADO" />
    </p-tabPanel>
  </p-tabView>
</section>
