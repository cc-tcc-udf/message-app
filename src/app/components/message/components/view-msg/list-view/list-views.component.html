<div class="h-full w-full card_default">
  <p-table [columns]="cols" [value]="views || []" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template pTemplate="header" let-columns>
      <tr>
        @for (col of columns; track $index) {
        <th>
          {{ col.header }}
        </th>
        }
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-msg let-columns="columns">
      <tr>
        @for (td of columns; track $index) {
        <td>
          <span *ngIf="!td.isDate" [ngClass]="{'tag': td.isTag}">
            {{ msg[td.field] }}
          </span>
          <span *ngIf="td.isDate">
            {{ msg[td.field] | date:'dd/MM/yyyy - HH:mm' }}
          </span>
        </td>
        }
      </tr>
    </ng-template>
  </p-table>
</div>
